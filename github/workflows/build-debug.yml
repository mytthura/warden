name: Build debug APK

# Manual build for the Burmese-localized fork.
# The upstream release.yml only runs on v* tags AND needs a signing key secret,
# so it does nothing on this fork. This workflow builds a debug APK on demand
# (debug-signed, installable for personal use, no key needed).
# Run it from the GitHub app/website: Actions -> "Build debug APK" -> Run workflow.
# The APK appears under the run's Artifacts as "warden-debug-apk".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: warden-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
